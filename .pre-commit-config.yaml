repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: ty
        name: ty type check
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: Offline tests
        entry: uv run --locked pytest
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
